<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Darelkola mark: the stethoscope (the app's brand glyph, on the splash and
       in the header) on the slate tile of the primary brand color. Self-
       contained dark tile so it reads on any browser-tab background. -->
  <rect width="64" height="64" rx="14" fill="#0F172B"/>
  <!-- Instrument keyline — a hairline plate edge; fades out gracefully at 16px. -->
  <rect x="3.5" y="3.5" width="57" height="57" rx="10.5" stroke="#F8FAFC" stroke-opacity="0.14"/>
  <g transform="translate(11.85 12.7) scale(1.68)" stroke="#F8FAFC" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
    <path d="M11 2v2"/>
    <path d="M5 2v2"/>
    <path d="M5 3H4a2 2 0 0 0-2 2v4a6 6 0 0 0 12 0V5a2 2 0 0 0-2-2h-1"/>
    <path d="M8 15a6 6 0 0 0 12 0v-3"/>
    <circle cx="20" cy="10" r="2"/>
  </g>
</svg>
